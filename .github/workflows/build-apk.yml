
name: Build AzanGo APK
# Re-run after fixing the Tapsell manifest placeholder patch

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare Android project
        run: |
          npm install
          npx cap add android
          python3 tools/patch_android.py
          npx cap sync android
          python3 tools/patch_android.py

      - name: Install Release Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing RELEASE_KEYSTORE_BASE64"
            exit 1
          fi

          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/azango-release.jks"

          test -s "$RUNNER_TEMP/azango-release.jks"

      - name: Configure Release Signing
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ]; then
            echo "::error::Missing release signing secrets"
            exit 1
          fi

          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("RELEASE_STORE_FILE"))
                      storePassword System.getenv("RELEASE_STORE_PASSWORD")
                      keyAlias System.getenv("RELEASE_KEY_ALIAS")
                      keyPassword System.getenv("RELEASE_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLE

          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode ${{ github.run_number }}/; s/versionName[[:space:]]+"[^"]*"/versionName "1.8.5"/' android/app/build.gradle

          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build Release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/azango-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AzanGo-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
