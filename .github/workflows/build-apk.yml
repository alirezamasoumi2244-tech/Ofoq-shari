
name: Build AzanGo APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Create Android project and add Kotlin code
        run: |
          npm install
          npx cap add android
          python3 tools/patch_android.py
          npx cap sync android
          python3 tools/patch_android.py

      - name: Install the persistent signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Missing repository secret DEBUG_KEYSTORE_B64"
            exit 1
          fi
          mkdir -p ~/.android
          printf '%s' "$KS" | base64 --decode > ~/.android/debug.keystore
          test -s ~/.android/debug.keystore

      - name: Configure signing and bump version
        env:
          DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          if [ -z "$DEBUG_STORE_PASSWORD" ] || [ -z "$DEBUG_KEY_PASSWORD" ]; then
            echo "::error::Missing DEBUG_KEYSTORE_PASSWORD or DEBUG_KEY_PASSWORD repository secret"
            exit 1
          fi
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                      storePassword System.getenv("DEBUG_STORE_PASSWORD")
                      keyAlias "androiddebugkey"
                      keyPassword System.getenv("DEBUG_KEY_PASSWORD")
                  }
              }
          }
          GRADLE
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.8.0\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build debug APK
        env:
          DEBUG_STORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AzanGo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
