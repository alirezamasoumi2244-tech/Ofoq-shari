name: Build AzanGo APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Create Android project and add Kotlin code
        run: |
          npm install
          npx cap add android
          python3 tools/patch_android.py
          npx cap sync android
          # icons again after sync (in case defaults came back)
          python3 tools/patch_android.py
          echo "=== launcher icons ==="
          find android/app/src/main/res -name 'ic_launcher*' | sort
      - name: Use the fixed signing key (so a new APK installs over the old one)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Secret DEBUG_KEYSTORE_B64 is missing (Settings > Secrets and variables > Actions)"; exit 1; fi
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
      - name: Bump versionCode on every build
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.8.0\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AzanGo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
